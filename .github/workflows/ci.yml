name: Offline preview candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: Offline Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen release snapshot before creating outputs
        if: github.event_name == 'workflow_dispatch'
        run: python -B -m scripts.release_candidate check --root .
      - name: Install locked development tools
        run: |
          python -m pip install uv==0.10.8
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Verify uv uses the matrix Python version
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          print(f"Python {sys.version} at {sys.executable}")
          assert sys.version_info[:2] == expected, (sys.version_info[:2], expected)
          PY
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy opencs adapters scripts tests build_backend.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/check_foundation.py --contracts-only
      - name: Build artifacts outside source
        run: uv run --no-sync python -m scripts.build_package --out "${{ runner.temp }}/opencs-artifacts"
      - name: Fresh wheel and sdist installs, normal + three fault scenarios each
        run: >-
          uv run --no-sync python -m scripts.verify_distributions
          --dist "${{ runner.temp }}/opencs-artifacts"
          --output "${{ runner.temp }}/opencs-evidence/smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: opencs-0.1.0a1-offline-candidate-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/opencs-artifacts/
            ${{ runner.temp }}/opencs-evidence/
          if-no-files-found: error
